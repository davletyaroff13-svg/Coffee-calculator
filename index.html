<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30291f">
<title>Coffee Control 5.0</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f2ec;color:#29241f;font-synthesis:none;--ink:#30291f;--muted:#756e63;--line:#e7e0d6;--green:#22704e}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:650;background:var(--ink);color:#fff;min-height:44px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:default}.secondary{background:#eae3d9;color:var(--ink)}.danger{background:#a23930}input,select,textarea{width:100%;border:1px solid #ccc3b7;background:white;border-radius:9px;padding:11px;color:inherit;min-width:0}input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}textarea{min-height:120px;resize:vertical}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}h1{font-size:26px;margin:0 0 5px;letter-spacing:-1px}h2{font-size:21px;margin:0 0 15px}h3{font-size:16px;margin:22px 0 10px}p{line-height:1.55}small,.muted{color:var(--muted)}a{color:var(--ink)}header{max-width:1180px;margin:auto;padding:24px 24px 12px;display:flex;justify-content:space-between;gap:20px;align-items:center}.workspace{display:flex;gap:8px;align-items:center}.workspace select{max-width:250px}.version{font-size:11px;background:#e4d3a9;color:#5d451b;padding:4px 7px;border-radius:6px;display:inline-block;letter-spacing:.5px}nav{max-width:1180px;margin:auto;display:flex;gap:7px;padding:12px 24px;flex-wrap:wrap}nav button{background:transparent;color:var(--muted);padding:10px 13px}nav button.active{background:var(--ink);color:white}main{max-width:1180px;margin:0 auto;padding:8px 24px 40px}.panel{background:white;border:1px solid #eae3d9;border-radius:18px;padding:22px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}.stat{background:#f6f3ed;border-radius:12px;padding:17px}.stat strong{display:block;font-size:25px;margin-top:9px;letter-spacing:-.5px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.note{font-size:13px;padding:12px 15px;border-radius:10px;background:#fff5df;line-height:1.6}.good{color:#22704e}.bad{color:#a73930}.warn{color:#85621c}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:12px 9px;text-align:left;vertical-align:middle}th{color:var(--muted);font-size:12px}td input,td select{min-width:95px}th:first-child,td:first-child{padding-left:0}.pill{display:inline-block;border-radius:6px;background:#eee8dd;padding:4px 8px;font-size:12px}section[hidden]{display:none}details{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}summary{cursor:pointer;font-weight:650;min-height:28px}.catalog-item{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:400;margin:0;padding:11px 0;border-bottom:1px solid var(--line)}.catalog-item input{flex:none}.bar{height:8px;border-radius:8px;background:#eee7dc;overflow:hidden;margin:10px 0}.bar span{height:100%;display:block;background:#9c805c}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border-radius:12px;background:#30291f;color:white;padding:13px 20px;max-width:min(92vw,650px);z-index:50;box-shadow:0 5px 25px #0003}#toast:empty{display:none}#fatal{max-width:700px;margin:40px auto;padding:24px;background:white;border-radius:16px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.empty{padding:25px;text-align:center;color:var(--muted)}footer{max-width:1180px;margin:auto;padding:0 24px 25px;font-size:12px;color:var(--muted)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #b99662;outline-offset:2px}progress{width:100%;accent-color:#997652}#busy{display:none}.busy #busy{display:block}.busy button{pointer-events:none}svg{max-width:100%;height:auto}.chart{overflow:auto}.chart svg{min-width:500px}.field-help{font-size:12px;color:var(--muted);margin:5px 0 12px}
@media(max-width:700px){header{padding:18px 14px 6px;align-items:flex-start;flex-wrap:wrap;gap:14px}h1{font-size:24px}.workspace{width:100%}.workspace select{max-width:none}nav{padding:10px 12px;gap:4px}nav button{font-size:13px;flex:1 1 auto;padding:9px}main{padding:0 12px 30px}.panel{padding:17px;border-radius:14px}.split{grid-template-columns:1fr}.stat strong{font-size:23px}.tablewrap table,.tablewrap tbody{display:block}.tablewrap thead{display:none}.tablewrap tr{display:block;border-bottom:1px solid var(--line);padding:12px 0}.tablewrap td{display:block;border:0;padding:6px 0}.tablewrap td[data-label]::before{content:attr(data-label);display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.tablewrap td:first-child{font-weight:650}.tablewrap td input,.tablewrap td select{min-width:0}.row>button{flex:1 1 auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.catalog-grid{grid-template-columns:1fr}footer{padding:0 14px 20px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}

/* Clear mobile navigation and calmer information hierarchy. */
:root{background:#f6f7f4;--ink:#214c3b;--muted:#6e7972;--line:#e4e9e3;color:#23372c}
header{max-width:920px;padding-top:24px}header h1{font-size:23px;letter-spacing:-.6px}.version{background:#e7eee5;color:#53745b}.workspace label{display:none}.workspace select{background:#fff;border-color:var(--line)}
main,footer{max-width:920px}main{padding-bottom:110px}nav{max-width:920px;flex-wrap:nowrap}nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}nav button span{font-size:20px}.panel{border-color:var(--line);box-shadow:0 4px 18px #24402c04}.stat{background:#f3f6f0}.note{background:#f6f4e9;color:#6c6548}.secondary{background:#edf1e9;color:#35543c}.pill{background:#edf2e9;color:#5f735d}.welcome{padding:20px 2px 6px}.welcome>small{font-size:10px;letter-spacing:1.4px;font-weight:700}.welcome h2{font-size:29px;letter-spacing:-1px;margin:8px 0}.welcome p{color:var(--muted);margin-top:5px}.today-panel{padding:24px}.today-panel .stat{background:transparent;padding:10px 0}.today-panel .stat strong{font-size:32px}.primary-wide{width:100%;margin-top:9px;padding:15px}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.quick-grid button{text-align:left;background:white;color:#23372c;border:1px solid var(--line);padding:18px;border-radius:16px}.quick-grid button>span{display:block;color:#5e7c5b;font-size:25px;margin-bottom:12px}.quick-grid b,.quick-grid small{display:block}.quick-grid small{font-size:12px;margin-top:7px;line-height:1.4;font-weight:400}.profit-number{font-size:36px;font-weight:750;letter-spacing:-1px;margin:12px 0}.menu-list{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.menu-list button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:white;color:#23372c;border-radius:0;padding:20px;border-bottom:1px solid var(--line);gap:12px}.menu-list button:last-child{border-bottom:0}.menu-list b,.menu-list small{display:block}.menu-list small{font-size:13px;font-weight:400;line-height:1.5;margin-top:5px}.menu-list button>span:last-child{font-size:26px;color:#879582}.back-link{font-size:13px;margin-top:12px}footer{padding-bottom:110px}#toast{bottom:100px}details>summary{padding:5px 0;line-height:1.5}.chart svg{min-width:0}
@media(max-width:700px){header{padding:18px 16px 5px;gap:12px}header h1{font-size:22px}.workspace{width:100%}.workspace select{padding:10px 12px}.workspace button{background:transparent}main{padding:0 14px 105px}.welcome{padding-top:18px}.welcome h2{font-size:27px}nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:none;padding:9px 6px calc(9px + env(safe-area-inset-bottom));background:#fffffff5;backdrop-filter:blur(14px);border-top:1px solid var(--line);gap:3px}nav button{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:10px;padding:6px 2px;border-radius:12px;background:transparent!important;color:#7c877d}nav button.active{color:#214c3b;background:#edf3e9!important}nav button span{font-size:22px;line-height:24px}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-grid button{padding:17px}.today-panel{padding:20px}.today-panel .grid{grid-template-columns:1.35fr 1fr}.today-panel .stat strong{font-size:29px}.panel{padding:18px}.profit-number{font-size:32px}.grid{gap:10px}.stat strong{overflow-wrap:anywhere}footer{font-size:11px;line-height:1.6}table tr{background:#fafbf8;border-radius:12px;padding:13px!important;margin:10px 0;border:1px solid var(--line)!important}table td{padding-left:10px!important;padding-right:10px!important}}

</style>
</head>
<body>
<div id="fatal" hidden></div>
<div id="app">
<header><div><h1>☕ Coffee Control <span class="version">5.0</span></h1><small>Твой помощник в кофейне</small></div><div class="workspace"><label for="cafeSelect" class="muted">Кофейня</label><select id="cafeSelect" aria-label="Активная кофейня"></select><button id="manageCafes" class="secondary" aria-label="Управление кофейнями">⚙</button></div></header>
<nav id="nav" aria-label="Разделы"></nav>
<main><p id="busy" class="note" role="status">Подождите, обрабатываем данные…</p><section id="view"></section></main>
<footer><span id="privacyState">Данные хранятся только в этом браузере. Без регистрации и отправки на сервер.</span> Расчёты управленческие, не налоговая отчётность. <span id="saveState"></span></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./src/app.js"></script>
</body></html>
